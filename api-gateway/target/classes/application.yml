server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      routes:
        - id: book-service
          uri: http://localhost:8081
          predicates:
            - Path=/books/**


        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/orders/**


        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/users/**

        - id: admin-service
          uri: http://localhost:8084
          predicates:
            - Path=/admin/**

        - id: cart-service
          uri: http://localhost:8085
          predicates:
            - Path=/cart/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka